<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Konfirmasi email AEROSENSE</title>
</head>
<body style="margin:0;background:#edf6ff;font-family:Arial,sans-serif;color:#103154">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#edf6ff">
    <tr>
      <td align="center" style="padding:24px 16px">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#fff;border:1px solid #c7ddef;border-radius:20px">
          <tr>
            <td style="padding:20px 24px;background:#103a92;background-image:linear-gradient(115deg,#103a92,#1668c9);border-radius:19px 19px 0 0;color:#fff">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="color:#fff;font-size:19px;font-weight:700">AEROSENSE</td>
                  <td width="80" align="right">
                    <img src="https://aerosense.me/assets/aerobot/falcon/welcome.webp" width="76" height="76" alt="" style="display:block">
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 24px 32px">
              <h1 style="margin:0;color:#103154;font-size:26px;line-height:1.2">Konfirmasi email Anda</h1>
              <p style="margin:14px 0 22px;color:#365674;font-size:16px;line-height:1.6">Klik tombol di bawah untuk mengaktifkan akun AEROSENSE Anda.</p>
              <table role="presentation" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="background:#c4ef59;border-radius:12px">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 20px;border:1px solid #c4ef59;border-radius:12px;color:#102c50;font-size:16px;font-weight:700;text-decoration:none">Konfirmasi email</a>
                  </td>
                </tr>
              </table>
              <p style="margin:24px 0 0;color:#365674;font-size:14px;line-height:1.6">Jika Anda tidak mendaftar, abaikan email ini.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
