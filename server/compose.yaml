name: aerosense-backend
services:
  aerosense-api:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks: [n8n]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
networks:
  n8n:
    external: true
    name: n8n_default
